monitor_speed = 115200
extra_scripts = post:auto_push.py
lib_deps = 
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit MCP23017 Arduino Library